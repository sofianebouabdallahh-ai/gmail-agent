[project]
name = "gmail-agent"
version = "0.1.0"
description = "Gmail triage harness: extraction and triage agents, skills, policy guardrails, evals"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-google-community[gmail]>=5.1.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
gmail-agent = "gmail_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
